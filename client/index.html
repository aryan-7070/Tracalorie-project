    <title>Tracalorie</title>
    <!--
      No third-party origins here on purpose. Bootstrap and react-bootstrap
      are bundled from node_modules, and every font-family in the stylesheets
      already declares a system fallback. Keeping this document self-hosted is
      what lets the API ship a `default-src 'none'` CSP: a CDN stylesheet or
      webfont would be blocked in production and render the app unstyled.
    -->
    <link rel="stylesheet" href="/src/styles.css" />
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
